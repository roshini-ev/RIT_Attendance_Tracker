<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>RIT Punch</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="staff-app">
  <header class="header">
    <div class="hdr-left">
      <div class="hdr-logo">RIT</div>
      <div class="hdr-brand">
        <div class="hdr-rit">Staff Attendance</div>
        <div class="hdr-tagline">Rajalakshmi Institute of Technology</div>
      </div>
    </div>
    <a class="hdr-logout" href="/logout" onclick="if(window.AndroidBridge){try{window.AndroidBridge.onStaffLoggedOut();}catch(e){}}">Logout</a>
  </header>

  <main class="staff-main">
    <div class="punch-card">
      <!-- Attendance Section -->
      <section class="attendance-section" aria-label="Attendance Punch">
        <p class="punch-kicker">Logged in as</p>
        <div class="staff-id-display" id="staffIdDisplay">{{ staff_id }}</div>

        <!-- Native Phone Selection Display for Android App -->
        <div id="phoneSection" style="display:none; margin: 10px 0 16px;">
          <div id="phoneBadge" style="display:inline-flex; align-items:center; gap:6px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #e0f2fe; color: #0369a1;">
            <span>📱</span>
            <span>Phone:</span>
            <span id="phoneNumberDisplay" style="font-weight: 700;">Pending</span>
          </div>
          <div style="margin-top: 8px;">
            <button id="btnSelectPhone" type="button" style="display:none; padding: 8px 16px; background: #f59e0b; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer;">
              Select Phone Number
            </button>
          </div>
        </div>

        <p class="punch-hint" id="punchHint">Tap once to record your presence. Location is used only to detect your block.</p>

        {% if has_pushed %}
          <button id="pushButton" class="push-btn pushed" disabled>PUSHED</button>
          <p class="punch-done">Your punch is already recorded for today.</p>
        {% else %}
          <button id="pushButton" class="push-btn">PUSH</button>
        {% endif %}

        <div id="statusMessage" class="status-msg"></div>
      </section>

      <!-- Staff Remarks Section DIRECTLY BELOW PUSH Button -->
      <div class="remark-divider"></div>
      <section class="remark-section" id="staffRemarksSection" aria-label="Staff Remarks">
        <div class="remark-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h2 class="remark-title" style="margin:0; font-size:12px; font-weight:700; color:#1e293b; text-transform:uppercase; letter-spacing:0.5px;">Staff Remarks</h2>
          <span id="remarkCharCount" style="font-size:11px; color:#94a3b8; font-family:monospace;">0/50</span>
        </div>

        <input type="hidden" id="remarkStaffId" name="staff_id" value="{{ staff_id }}">

        <div class="remark-field" style="margin-bottom:8px;">
          <textarea
            id="remarkContent"
            name="remark"
            class="remark-textarea"
            rows="2"
            maxlength="50"
            placeholder="Enter your remark..."
            style="width:100%; box-sizing:border-box; resize:none;"
          ></textarea>
        </div>

        <button type="button" id="btnSubmitRemark" class="btn-submit-remark" style="width:100%; height:38px;">
          <span class="btn-label">Submit Remark</span>
          <span class="btn-spinner" style="display:none;">Submitting...</span>
        </button>
        <div id="remarkStatusMessage" class="remark-status" role="alert" style="margin-top:6px; min-height:16px;"></div>
      </section>
    </div>
  </main>

  <script src="/static/staff.js"></script>
</body>
</html>
